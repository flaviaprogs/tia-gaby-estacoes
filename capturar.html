<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Enviar ao Radar • Tia Gaby</title><style>:root{--bg:#0b1020;--p:#121933;--t:#f8fafc;--m:#9aa4bf;--a:#8b5cf6;--a2:#ec4899;--b:rgba(255,255,255,.1)}*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#080c18,#0f1730);color:var(--t);min-height:100vh}.wrap{max-width:560px;margin:auto;padding:18px;padding-top:max(18px,env(safe-area-inset-top))}.card{background:#121933;border:1px solid var(--b);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}h1{margin:0 0 5px;font-size:22px}p{color:var(--m);font-size:13px;line-height:1.45}label{display:block;font-size:12px;color:#cbd5e1;margin:11px 0 6px}input,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--b);background:#0d142a;color:white}textarea{min-height:150px}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:linear-gradient(90deg,var(--a),var(--a2));color:white}.secondary{background:#24304f;color:white}.msg{margin-top:12px;font-size:13px;line-height:1.45}.score{display:inline-block;padding:6px 9px;border-radius:9px;font-weight:800;margin-top:8px}.high{background:#153924;color:#86efac}.mid{background:#3c2d12;color:#fcd34d}.low{background:#3a1620;color:#fca5a5}.hide{display:none}.ok{color:#86efac}.warn{color:#fcd34d}.small{font-size:11px;color:#94a3b8;margin-top:10px}</style></head><body><div class="wrap"><div class="card"><h1>🎯 Enviar ao Radar</h1><p>Compartilhe uma publicação do Facebook, Instagram ou outra fonte. O Radar analisa e cria a oportunidade.</p><div id="loginBox" class="hide"><label>E-mail</label><input id="email" type="email" autocomplete="email"><label>Senha</label><input id="password" type="password" autocomplete="current-password"><button class="btn secondary" onclick="login()">Entrar</button><div class="small">Use o mesmo acesso da Tia Gaby Estações.</div></div><div id="captureBox"><label>Link da publicação</label><input id="url" placeholder="https://..."><label>Texto / pedido</label><textarea id="text" placeholder="Cole ou compartilhe o texto da publicação"></textarea><button class="btn primary" onclick="analyzeAndSave()">⚡ Analisar e salvar</button><button class="btn secondary" onclick="location.href='./'">Abrir painel</button></div><div id="msg" class="msg"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://uwqusqjkximldyjkakll.supabase.co','sb_publishable_S63mXGdQNIHqvIueu7WSaQ_aBzirX6d');let user=null;const $=id=>document.getElementById(id);function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function serviceOf(t){t=norm(t);let a=[];if(/algodao[ -]?doce/.test(t))a.push('Algodão-doce');if(t.includes('pipoca'))a.push('Pipoca');if(t.includes('acai'))a.push('Açaí');return a.length>1?'Combo de estações':a[0]||'A definir'}function scoreOf(t){t=norm(t);let s=35;['preciso','procuro','procurando','busco','orcamento','indicacao','contratar','valor','preco','quem faz','alguem indica','para festa','evento'].forEach(k=>{if(t.includes(norm(k)))s+=7});if(/hoje|amanha|sabado|domingo|urgente/.test(t))s+=8;return Math.min(100,s)}function guestsOf(t){let m=String(t||'').match(/\b(\d{2,4})\s*(pessoas|convidad[oa]s?)\b/i);return m?Number(m[1]):null}function proposal(name,service){return `${name?'Oi, '+name+'!':'Oi! Tudo bem?'}\n\nVi sua publicação procurando ${service==='A definir'?'serviço para festa':service}. A Tia Gaby Estações trabalha com algodão-doce, pipoca e açaí para festas e eventos.\n\nPosso te enviar uma proposta com opções de pacote e valores? 😊\n\nTia Gaby Estações`}function parseIncoming(){const p=new URLSearchParams(location.search);let u=p.get('url')||'';let t=[p.get('title')||'',p.get('text')||''].filter(Boolean).join('\n').trim();if(!u){const m=t.match(/https?:\/\/\S+/i);if(m)u=m[0].replace(/[),.;]+$/,'')}url.value=u;text.value=t}async function login(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){msg.textContent='Erro: '+r.error.message;return}user=r.data.user;loginBox.classList.add('hide');captureBox.classList.remove('hide');msg.textContent='Login concluído. Agora salve a oportunidade.'}async function analyzeAndSave(){if(!user){msg.textContent='Entre primeiro.';return}const t=text.value.trim(),u=url.value.trim();if(!t&&!u){msg.textContent='Compartilhe ou cole uma publicação.';return}const service=serviceOf(t),score=scoreOf(t),guests=guestsOf(t),intent=score>=75?'Alta intenção':score>=55?'Média intenção':'Baixa intenção';const l={user_id:user.id,client_id:Date.now(),source:'Compartilhado pelo celular',service,post_url:u||null,post_text:t||u,guests,status:'Novo',score,intent,proposal_text:proposal('',service),captured_at:new Date().toISOString()};msg.textContent='Salvando...';const {data,error}=await sb.from('leads').insert(l).select().single();if(error){msg.textContent='Erro: '+error.message;return}msg.innerHTML=`<span class="ok">✅ Oportunidade salva.</span><br><span class="score ${score>=75?'high':score>=55?'mid':'low'}">${score}/100 • ${intent}</span><br>Serviço: <b>${service}</b>`;setTimeout(()=>{},100)}(async()=>{parseIncoming();const {data}=await sb.auth.getSession();user=data.session?.user||null;if(!user){loginBox.classList.remove('hide');captureBox.classList.add('hide')}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>

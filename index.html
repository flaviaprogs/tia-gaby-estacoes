<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>Tia Gaby Estações • Radar de Eventos IA</title>
<style>
:root{--bg:#0b1020;--p:#121933;--p2:#0f1730;--t:#f8fafc;--m:#9aa4bf;--a:#8b5cf6;--a2:#ec4899;--b:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(180deg,#080c18,#0f1730);color:var(--t)}.app{max-width:1200px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0;color:var(--m);font-size:13px}.badge{padding:7px 10px;border-radius:999px;background:#251d46;color:#c4b5fd;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat,.panel{background:rgba(18,25,51,.92);border:1px solid var(--b);border-radius:16px;padding:14px}.stat b{font-size:24px}.stat span{display:block;color:var(--m);font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h2{font-size:16px;margin:0 0 12px}label{display:block;color:#cbd5e1;font-size:12px;margin:9px 0 5px}
input,textarea,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--b);background:#0d142a;color:white}textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:linear-gradient(90deg,var(--a),var(--a2));color:white}.secondary{background:#24304f;color:white}.ghost{background:transparent;border:1px solid var(--b);color:#cbd5e1}
.lead{background:var(--p2);border:1px solid var(--b);border-radius:13px;padding:12px;margin:8px 0}.leadhead{display:flex;justify-content:space-between;gap:8px}.meta{color:var(--m);font-size:11px}.score{padding:6px 8px;border-radius:9px;font-size:12px;font-weight:800}.high{background:#153924;color:#86efac}.mid{background:#3c2d12;color:#fcd34d}.low{background:#3a1620;color:#fca5a5}.proposal{white-space:pre-wrap;background:#0a1023;padding:10px;border-radius:10px;font-size:12px;color:#dbeafe}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;overflow:auto}.col{min-width:210px;background:#0b1124;border:1px solid var(--b);border-radius:12px;padding:9px}.col h3{font-size:12px;color:#d8b4fe}.empty{color:var(--m);font-size:12px;text-align:center;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.toolbar input{max-width:230px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:repeat(4,220px)}}@media(max-width:520px){.row{grid-template-columns:1fr}.brand h1{font-size:20px}}
</style></head><body><div class="app">
<header><div class="brand"><h1>🎯 Tia Gaby Estações</h1><p>Radar de Eventos IA • dados online e sincronizados</p></div><div style="display:flex;gap:8px;align-items:center"><div class="badge">v2 • Supabase</div><button class="ghost" onclick="logout()">Sair</button></div></header>
<section class="stats"><div class="stat"><b id="s1">0</b><span>Oportunidades</span></div><div class="stat"><b id="s2">0</b><span>Leads quentes</span></div><div class="stat"><b id="s3">0</b><span>Propostas enviadas</span></div><div class="stat"><b id="s4">0</b><span>Fechados</span></div></section>
<section class="grid">
<div class="panel"><h2>➕ Nova oportunidade</h2><div class="row"><div><label>Fonte</label><select id="source"><option>Facebook - Grupo</option><option>Facebook - Feed</option><option>Facebook - Comentário</option><option>Instagram</option><option>WhatsApp</option></select></div><div><label>Serviço</label><select id="service"><option>Detectar automaticamente</option><option>Algodão-doce</option><option>Pipoca</option><option>Açaí</option><option>Combo de estações</option></select></div></div><label>Link</label><input id="link" placeholder="Cole o link do post"><label>Texto do pedido</label><textarea id="text" placeholder="Ex.: Procuro estação de pipoca e algodão-doce para festa..."></textarea><div class="row"><div><label>Cliente</label><input id="client"></div><div><label>Local</label><input id="location"></div></div><div class="row"><div><label>Data</label><input id="date" type="date"></div><div><label>Convidados</label><input id="guests" type="number"></div></div><div class="actions"><button class="primary" onclick="addLead()">⚡ Analisar e cadastrar</button><button class="secondary" onclick="demo()">Exemplo</button></div></div>
<div class="panel"><h2>🤖 Análise</h2><div id="analysis" class="empty">Selecione ou cadastre uma oportunidade.</div></div>
</section>
<section class="panel" style="margin-top:14px"><h2>📌 Oportunidades</h2><div class="toolbar"><input id="q" placeholder="Buscar..." oninput="render()"><select id="f" onchange="render()"><option value="">Todos</option><option>Novo</option><option>Proposta enviada</option><option>Negociação</option><option>Fechado</option><option>Perdido</option></select></div><div id="list"></div></section>
<section class="panel" style="margin-top:14px"><h2>🧭 Funil</h2><div id="kanban" class="kanban"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://uwqusqjkximldyjkakll.supabase.co','sb_publishable_S63mXGdQNIHqvIueu7WSaQ_aBzirX6d');let user=null,leads=[],active=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function serviceOf(t,s){if(s!='Detectar automaticamente')return s;t=t.toLowerCase();let a=[];if(t.includes('algod'))a.push('Algodão-doce');if(t.includes('pipoca'))a.push('Pipoca');if(t.includes('açaí')||t.includes('acai'))a.push('Açaí');return a.length>1?'Combo de estações':a[0]||'A definir'}
function scoreOf(t,loc,d,g){t=t.toLowerCase();let s=35;['preciso','procuro','orçamento','orcamento','indicação','indicacao','contratar','valor','quanto custa','urgente','quem faz'].forEach(k=>{if(t.includes(k))s+=7});if(loc)s+=8;if(d)s+=10;if(+g)s+=8;return Math.min(100,s)}
function proposal(l){return `${l.client_name?'Oi, '+l.client_name+'!':'Oi! Tudo bem?'}\n\nVi sua publicação procurando ${l.service==='A definir'?'serviço para festa':l.service}${l.location?' em '+l.location:''}. A Tia Gaby Estações trabalha com algodão-doce, pipoca e açaí para festas e eventos.\n\nPosso te enviar uma proposta com opções de pacote e valores? 😊\n\nTia Gaby Estações`}
async function load(){const {data,error}=await sb.from('leads').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);leads=data||[];render()}
async function addLead(){let t=text.value.trim();if(!t)return alert('Cole o texto do pedido.');let l={user_id:user.id,client_id:Date.now(),source:source.value,service:serviceOf(t,service.value),post_url:link.value||null,post_text:t,client_name:client.value||null,location:location.value||null,event_date:date.value||null,guests:guests.value?+guests.value:null,status:'Novo'};l.score=scoreOf(t,l.location,l.event_date,l.guests);l.intent=l.score>=75?'Alta intenção':l.score>=55?'Média intenção':'Baixa intenção';l.proposal_text=proposal(l);let {data,error}=await sb.from('leads').insert(l).select().single();if(error)return alert(error.message);leads.unshift(data);active=data.id;render();show(data)}
async function status(id,v){let {error}=await sb.from('leads').update({status:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);let l=leads.find(x=>x.id===id);if(l)l.status=v;render();if(active===id)show(l)}
function show(l){active=l.id;analysis.innerHTML=`<div class="lead"><div class="leadhead"><div><b>${esc(l.client_name||'Cliente não identificado')} • ${esc(l.service)}</b><div class="meta">${esc(l.source)} • ${esc(l.location||'Local não informado')} • ${esc(l.status)}</div></div><div class="score ${l.score>=75?'high':l.score>=55?'mid':'low'}">${l.score}/100</div></div><div class="proposal" style="margin-top:10px">${esc(l.proposal_text||'')}</div><div class="actions"><button class="primary" onclick="copyP('${l.id}')">📋 Copiar proposta</button>${l.post_url?`<a class="btn ghost" target="_blank" href="${esc(l.post_url)}">Abrir publicação</a>`:''}</div></div>`}
function copyP(id){let l=leads.find(x=>x.id===id);navigator.clipboard.writeText(l.proposal_text||'').then(()=>alert('Proposta copiada!'))}
function render(){s1.textContent=leads.length;s2.textContent=leads.filter(l=>l.score>=75).length;s3.textContent=leads.filter(l=>['Proposta enviada','Negociação','Fechado'].includes(l.status)).length;s4.textContent=leads.filter(l=>l.status==='Fechado').length;let qq=q.value.toLowerCase(),ff=f.value;let a=leads.filter(l=>(!qq||[l.client_name,l.location,l.service,l.post_text].join(' ').toLowerCase().includes(qq))&&(!ff||l.status===ff));list.innerHTML=a.length?a.map(l=>`<div class="lead"><div class="leadhead"><div onclick="show(leads.find(x=>x.id==='${l.id}'))" style="cursor:pointer"><b>${esc(l.client_name||'Cliente não identificado')} • ${esc(l.service)}</b><div class="meta">${esc(l.source)} • ${esc(l.location||'Local não informado')}</div></div><div class="score ${l.score>=75?'high':l.score>=55?'mid':'low'}">${l.score}/100</div></div><div class="actions"><select onchange="status('${l.id}',this.value)">${['Novo','Proposta enviada','Negociação','Fechado','Perdido'].map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select></div></div>`).join(''):'<div class="empty">Nenhuma oportunidade.</div>';kanban.innerHTML=['Novo','Proposta enviada','Negociação','Fechado'].map(s=>`<div class="col"><h3>${s} (${leads.filter(l=>l.status===s).length})</h3>${leads.filter(l=>l.status===s).map(l=>`<div class="lead" onclick="show(leads.find(x=>x.id==='${l.id}'))"><b>${esc(l.client_name||'Cliente')}</b><div class="meta">${esc(l.service)} • ${esc(l.location||'Sem local')}</div></div>`).join('')||'<div class="empty">Vazio</div>'}</div>`).join('')}
function demo(){source.value='Facebook - Grupo';service.value='Detectar automaticamente';text.value='Procuro estação de pipoca e algodão doce para aniversário em Nova Iguaçu, cerca de 80 convidados. Preciso de orçamento.';client.value='Mariana';location.value='Nova Iguaçu';guests.value=80}
async function logout(){await sb.auth.signOut();location.href='login.html'}
(async()=>{let {data}=await sb.auth.getSession();if(!data.session)return location.href='login.html';user=data.session.user;await sb.from('settings').upsert({user_id:user.id,business_name:'Tia Gaby Estações',scan_times:['08:00','15:00','19:00']},{onConflict:'user_id'});load()})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>

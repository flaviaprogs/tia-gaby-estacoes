<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Tia Gaby Estações</title><style>body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#080c18,#0f1730);color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,420px);background:#121933;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}h1{margin:0 0 6px;font-size:24px}p{color:#9aa4bf;font-size:13px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.field{margin:10px 0}label{display:block;font-size:12px;color:#cbd5e1;margin-bottom:6px}input{width:100%;box-sizing:border-box;background:#0d142a;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px}.btn{width:100%;border:0;border-radius:12px;padding:12px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;margin-top:8px}.ghost{background:#24304f}.linkbtn{background:transparent;border:0;color:#93c5fd;text-decoration:underline;cursor:pointer;padding:0;margin-top:10px}.msg{margin-top:12px;font-size:12px;line-height:1.45;color:#dbeafe}.small{font-size:11px;color:#94a3b8;margin-top:14px}</style></head><body><div class="card"><h1>🎯 Tia Gaby Estações</h1><p>Entre para acessar o Radar de Eventos IA.</p><div class="tabs"><button class="btn ghost" onclick="mode='login';renderMode()">Entrar</button><button class="btn ghost" onclick="mode='signup';renderMode()">Criar acesso</button></div><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" placeholder="email@exemplo.com"></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="mínimo 6 caracteres"></div><button id="submit" class="btn" onclick="submitAuth()">Entrar</button><button class="linkbtn" onclick="resendConfirmation()">Reenviar e-mail de confirmação</button><div id="msg" class="msg"></div><div class="small">Uso individual. Os dados ficam protegidos por autenticação no banco.</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SB_URL='https://uwqusqjkximldyjkakll.supabase.co';const SB_KEY='sb_publishable_S63mXGdQNIHqvIueu7WSaQ_aBzirX6d';const PUBLIC_URL='https://flaviaprogs.github.io/tia-gaby-estacoes/';const sb=supabase.createClient(SB_URL,SB_KEY);let mode='login';function renderMode(){document.getElementById('submit').textContent=mode==='login'?'Entrar':'Criar acesso';document.getElementById('msg').textContent=''}async function submitAuth(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const msg=document.getElementById('msg');if(!email||password.length<6){msg.textContent='Informe um e-mail válido e uma senha com pelo menos 6 caracteres.';return}msg.textContent='Processando...';let res;if(mode==='login')res=await sb.auth.signInWithPassword({email,password});else res=await sb.auth.signUp({email,password,options:{emailRedirectTo:PUBLIC_URL}});if(res.error){msg.textContent='Erro: '+res.error.message;return}if(mode==='signup'&&!res.data.session){msg.textContent='Acesso criado. Confira o e-mail para confirmar a conta. O link agora volta para o site da Tia Gaby.';return}location.href=PUBLIC_URL}async function resendConfirmation(){const email=document.getElementById('email').value.trim();const msg=document.getElementById('msg');if(!email){msg.textContent='Digite o e-mail primeiro.';return}msg.textContent='Reenviando confirmação...';const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:PUBLIC_URL}});msg.textContent=error?'Erro: '+error.message:'E-mail de confirmação reenviado. Use o link mais recente recebido.'}(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.href=PUBLIC_URL})();</script></body></html>
